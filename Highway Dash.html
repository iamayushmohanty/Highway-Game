<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Highway Dash</title>
<style>
:root{--bg:#e9eef2;--ink:#1d2b36;--road:#3a4a58;--line:#f3ead0;--grass:#79a86b;--hero:#ffb703;--panel:#fffdf6;--btn:#1d2b36;--btnink:#fffdf6;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#10171d;--ink:#eef1f3;--road:#2b3743;--line:#d9cfae;--grass:#3f6a45;--panel:#1b252d;--btn:#ffb703;--btnink:#1d2b36}}
:root[data-theme="dark"]{--bg:#10171d;--ink:#eef1f3;--road:#2b3743;--line:#d9cfae;--grass:#3f6a45;--panel:#1b252d;--btn:#ffb703;--btnink:#1d2b36}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font-family:"Chakra Petch",system-ui,sans-serif;display:flex;align-items:center;justify-content:center;touch-action:none;user-select:none;-webkit-user-select:none}
#wrap{position:relative;height:100%;max-height:760px;aspect-ratio:9/16;max-width:100%}
canvas{width:100%;height:100%;display:block;border-radius:12px}
#hud{position:absolute;top:10px;left:14px;right:14px;display:flex;justify-content:space-between;font-weight:700;font-size:20px;color:#fffdf6;text-shadow:0 1px 3px rgba(0,0,0,.6);pointer-events:none}
#ov{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;padding:24px}
#card{background:var(--panel);color:var(--ink);padding:24px;border-radius:14px;text-align:center;max-width:280px;box-shadow:0 6px 24px rgba(0,0,0,.35)}
h1{margin:0 0 8px;font-size:30px}
p{margin:0 0 16px;line-height:1.4;font-size:15px}
button{font:inherit;font-weight:700;font-size:18px;background:var(--btn);color:var(--btnink);border:0;border-radius:10px;padding:12px 28px;cursor:pointer}
button:focus-visible{outline:3px solid var(--hero);outline-offset:3px}
</style>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;700&display=swap">
</head>
<body>
<div id="wrap">
<canvas id="c" width="360" height="640"></canvas>
<div id="hud"><span id="sc">0 m</span><span id="bs">Best 0 m</span></div>
<div id="ov"><div id="card"><h1 id="t">Highway Dash</h1><p id="m">Dodge the traffic. Tap the left or right side of the screen, swipe, or use the arrow keys.</p><button id="go">Start driving</button></div></div>
</div>
<script>
const cv=document.getElementById('c'),x=cv.getContext('2d');
const W=360,H=640,L=[80,180,280],CW=44,CH=78;
const ov=document.getElementById('ov'),sc=document.getElementById('sc'),bs=document.getElementById('bs');
let best=0;try{best=+localStorage.getItem('hd-best')||0}catch(e){}
bs.textContent='Best '+best+' m';
let run=false,lane=1,px=L[1],cars=[],dist=0,speed=260,off=0,spawn=0,last=0,tilt=0;
const cols=['#2a9d8f','#e63946','#f1f5f9','#457b9d','#9b5de5'];
function css(v){return getComputedStyle(document.documentElement).getPropertyValue(v).trim()}
function car(cx,cy,c,hero){
  x.fillStyle='#111';x.fillRect(cx-CW/2-3,cy-CH/2+10,6,16);x.fillRect(cx+CW/2-3,cy-CH/2+10,6,16);
  x.fillRect(cx-CW/2-3,cy+CH/2-26,6,16);x.fillRect(cx+CW/2-3,cy+CH/2-26,6,16);
  x.fillStyle=c;x.beginPath();x.roundRect(cx-CW/2,cy-CH/2,CW,CH,9);x.fill();
  x.fillStyle='rgba(20,30,40,.75)';x.beginPath();x.roundRect(cx-CW/2+6,cy-CH/2+(hero?14:CH-34),CW-12,20,4);x.fill();
  x.fillStyle=hero?'#fff7c2':'#ffd6d6';
  const hy=hero?cy-CH/2+2:cy+CH/2-6;x.fillRect(cx-CW/2+4,hy,9,4);x.fillRect(cx+CW/2-13,hy,9,4);
}
function draw(){
  x.fillStyle=css('--grass');x.fillRect(0,0,W,H);
  x.fillStyle=css('--road');x.fillRect(30,0,300,H);
  x.fillStyle=css('--line');x.fillRect(30,0,4,H);x.fillRect(326,0,4,H);
  for(const lx of [130,230])for(let y=-60+off%60;y<H;y+=60)x.fillRect(lx-2,y,4,34);
  cars.forEach(o=>car(o.x,o.y,o.c,false));
  x.save();x.translate(px,H-120);x.rotate(tilt);x.translate(-px,-(H-120));car(px,H-120,css('--hero')||'#ffb703',true);x.restore();
}
function hit(o){return Math.abs(o.x-px)<CW-6&&Math.abs(o.y-(H-120))<CH-8}
function tick(t){
  const dt=Math.min((t-last)/1000||0,.05);last=t;
  if(run){
    speed=260+Math.min(dist*.35,380);dist+=speed*dt/20;off+=speed*dt;
    const target=L[lane];tilt=(target-px)*.004;px+=(target-px)*Math.min(1,dt*14);
    spawn-=dt;
    if(spawn<=0){
      spawn=Math.max(.38,.95-dist/2500);
      const a=Math.floor(Math.random()*3);
      cars.push({x:L[a],y:-CH,c:cols[Math.floor(Math.random()*cols.length)],v:.55+Math.random()*.2});
      if(Math.random()<.25){const b=(a+1+Math.floor(Math.random()*2))%3;cars.push({x:L[b],y:-CH,c:cols[Math.floor(Math.random()*cols.length)],v:.55+Math.random()*.2})}
    }
    cars.forEach(o=>o.y+=speed*o.v*dt*1.6);
    cars=cars.filter(o=>o.y<H+CH);
    if(cars.some(hit))over();
    sc.textContent=Math.floor(dist)+' m';
  }
  draw();requestAnimationFrame(tick);
}
function start(){cars=[];dist=0;lane=1;px=L[1];spawn=.5;speed=260;run=true;ov.style.display='none'}
function over(){
  run=false;const d=Math.floor(dist);
  if(d>best){best=d;try{localStorage.setItem('hd-best',best)}catch(e){}}
  bs.textContent='Best '+best+' m';
  document.getElementById('t').textContent='Crash!';
  document.getElementById('m').textContent='You drove '+d+' m. Your best is '+best+' m.';
  document.getElementById('go').textContent='Drive again';
  ov.style.display='flex';
}
function move(d){if(run)lane=Math.max(0,Math.min(2,lane+d))}
document.getElementById('go').onclick=start;
addEventListener('keydown',e=>{
  if(['ArrowLeft','a','A'].includes(e.key))move(-1);
  else if(['ArrowRight','d','D'].includes(e.key))move(1);
  else if((e.key==='Enter'||e.key===' ')&&!run&&document.activeElement.id!=='go')start();
});
let sx=null;
cv.addEventListener('pointerdown',e=>{sx=e.clientX});
cv.addEventListener('pointerup',e=>{
  if(sx===null)return;const dx=e.clientX-sx;sx=null;
  if(Math.abs(dx)>30)move(dx>0?1:-1);
  else{const r=cv.getBoundingClientRect();move(e.clientX<r.left+r.width/2?-1:1)}
});
requestAnimationFrame(tick);
</script>
</body>
</html>
